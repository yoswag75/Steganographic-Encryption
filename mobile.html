<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Scanner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #000000;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --text-accent: #007aff;
            --success: #30d158;
            --error: #ff3b30;
            --warning: #ff9500;
            --border: #333333;
            --shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .app-header {
            padding: 20px;
            text-align: center;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .scanner-container {
            position: relative;
            margin: 20px;
            border-radius: 20px;
            overflow: hidden;
            background: var(--bg-secondary);
            box-shadow: var(--shadow);
        }

        #video {
            width: 100%;
            height: 60vh;
            object-fit: cover;
            display: block;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid var(--text-accent);
            border-radius: 16px;
            opacity: 0.8;
        }

        .scanner-frame::before,
        .scanner-frame::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-accent);
        }

        .scanner-frame::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .scanner-frame::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        .camera-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .control-btn.active {
            background: var(--text-accent);
        }

        .main-controls {
            padding: 30px 20px;
        }

        .scan-modes {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .scan-modes h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .mode-btn {
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--text-accent);
            color: var(--text-primary);
            border-color: var(--text-accent);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            background: var(--text-accent);
            color: var(--text-primary);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            flex: 1;
        }

        .file-input {
            position: absolute;
            left: -9999px;
        }

        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--success);
            color: var(--bg-primary);
            padding: 12px;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
            transform: translateY(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .status-bar.show {
            transform: translateY(0);
        }

        .result-panel {
            margin: 20px;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: none;
            animation: slideUp 0.4s ease;
        }

        .result-panel.show {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .result-type {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-type h3 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .type-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .type-qr {
            background: rgba(0, 122, 255, 0.2);
            color: var(--text-accent);
        }

        .type-steganography {
            background: rgba(48, 209, 88, 0.2);
            color: var(--success);
        }

        .copy-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .result-content {
            padding: 20px;
        }

        .text-result {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .text-result pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .file-result {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .file-result h4 {
            color: var(--success);
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .file-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .password-section {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .password-input::placeholder {
            color: var(--text-secondary);
        }

        .password-input:focus {
            outline: none;
            border-color: var(--text-accent);
        }

        .url-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 16px;
            border-radius: 12px;
            font-weight: 500;
            text-align: center;
            z-index: 1000;
            transform: translateY(100px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateY(0);
        }

        .notification.success {
            background: var(--success);
            color: var(--bg-primary);
        }

        .notification.error {
            background: var(--error);
            color: var(--text-primary);
        }

        @media (max-width: 480px) {
            .scanner-frame {
                width: 180px;
                height: 180px;
            }
            
            .main-controls {
                padding: 20px 16px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }

        /* Hide elements */
        .hidden {
            display: none !important;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.umd.min.js"></script>
</head>
<body>
    <div class="status-bar" id="statusBar">📡 Scanning active...</div>

    <div class="app-header">
        <h1>Universal Scanner</h1>
        <p>QR codes and hidden data detection</p>
    </div>

    <div class="scanner-container">
        <video id="video" playsinline></video>
        <div class="scanner-overlay">
            <div class="scanner-frame"></div>
        </div>
        <div class="camera-controls">
            <button class="control-btn" id="torchToggle" title="Toggle Flash">🔦</button>
            <button class="control-btn" id="cameraFlip" title="Flip Camera">🔄</button>
        </div>
    </div>

    <div class="main-controls">
        <div class="scan-modes">
            <h3>Scan Mode</h3>
            <div class="mode-grid">
                <button class="mode-btn active" onclick="setScanMode('both')" id="mode-both">Both</button>
                <button class="mode-btn" onclick="setScanMode('qr')" id="mode-qr">QR Only</button>
                <button class="mode-btn" onclick="setScanMode('steganography')" id="mode-stego">Hidden Only</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn" onclick="startScanning()" id="startBtn">
                📹 Start Camera
            </button>
            <button class="btn btn-secondary" onclick="stopScanning()" id="stopBtn" disabled>
                ⏹️ Stop
            </button>
        </div>

        <div class="action-buttons">
            <label for="imageUpload" class="file-upload">
                <input type="file" id="imageUpload" class="file-input" accept="image/*">
                <button class="btn btn-secondary" type="button">📁 Upload Image</button>
            </label>
        </div>
    </div>

    <div class="result-panel" id="resultPanel">
        <div class="result-header">
            <div class="result-type">
                <h3 id="resultTitle">Scan Result</h3>
                <span class="type-badge" id="typeBadge">QR Code</span>
            </div>
            <button class="copy-btn" onclick="copyToClipboard()" id="copyBtn">📋 Copy</button>
        </div>
        <div class="result-content" id="resultContent">
            <!-- Dynamic content -->
        </div>
    </div>

    <script>
        let qrScanner = null;
        let currentStream = null;
        let scanMode = 'both';
        let currentCamera = 'environment';
        let lastScanResult = null;
        let isScanning = false;

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            checkCameraAvailability();
        });

        function setupEventListeners() {
            document.getElementById('imageUpload').addEventListener('change', handleImageUpload);
            document.getElementById('torchToggle').addEventListener('click', toggleTorch);
            document.getElementById('cameraFlip').addEventListener('click', flipCamera);
        }

        async function checkCameraAvailability() {
            try {
                const hasCamera = await QrScanner.hasCamera();
                if (!hasCamera) {
                    showNotification('No camera detected. Use upload feature instead.', 'error');
                    document.getElementById('startBtn').disabled = true;
                }
            } catch (error) {
                console.error('Camera check failed:', error);
            }
        }

        async function startScanning() {
            try {
                const video = document.getElementById('video');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');

                startBtn.disabled = true;
                stopBtn.disabled = false;

                qrScanner = new QrScanner(
                    video,
                    result => handleScanResult(result, 'qr'),
                    {
                        preferredCamera: currentCamera,
                        highlightScanRegion: false,
                        highlightCodeOutline: false,
                    }
                );

                await qrScanner.start();
                isScanning = true;
                
                if (scanMode === 'both' || scanMode === 'steganography') {
                    startSteganographyScanning();
                }

                showStatus(true);
                showNotification('Camera started successfully!', 'success');
                
            } catch (error) {
                console.error('Camera start error:', error);
                showNotification('Failed to start camera: ' + error.message, 'error');
                document.getElementById('startBtn').disabled = false;
            }
        }

        function stopScanning() {
            if (qrScanner) {
                qrScanner.stop();
                qrScanner = null;
            }
            
            isScanning = false;
            showStatus(false);
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            showNotification('Camera stopped', 'success');
        }

        function startSteganographyScanning() {
            if (!isScanning) return;
            
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const analyzeFrame = () => {
                if (!isScanning) return;
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                
                try {
                    const imageData = canvas.toDataURL('image/png');
                    checkForHiddenData(imageData);
                } catch (error) {
                    // Continue scanning
                }
                
                setTimeout(analyzeFrame, 2000);
            };
            
            setTimeout(analyzeFrame, 1000);
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const imageData = e.target.result;
                
                await Promise.all([
                    tryQRScan(imageData),
                    trySteganographyScan(imageData)
                ]);
            };
            reader.readAsDataURL(file);
        }

        async function tryQRScan(imageData) {
            try {
                if (scanMode === 'steganography') return;
                
                const result = await QrScanner.scanImage(imageData);
                handleScanResult(result, 'qr');
            } catch (error) {
                // No QR code found
            }
        }

        async function trySteganographyScan(imageData) {
            try {
                if (scanMode === 'qr') return;
                
                await checkForHiddenData(imageData);
            } catch (error) {
                // No hidden data found
            }
        }

        async function checkForHiddenData(imageDataUrl) {
            try {
                const img = new Image();
                img.onload = async function() {
                    try {
                        const hiddenData = await extractDataFromImage(img);
                        handleScanResult(hiddenData, 'steganography');
                    } catch (error) {
                        // No hidden data
                    }
                };
                img.src = imageDataUrl;
            } catch (error) {
                // Continue scanning
            }
        }

        async function extractDataFromImage(image) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = image.width;
            canvas.height = image.height;
            ctx.drawImage(image, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;

            let binaryData = '';
            const delimiter = '1111111111111110';

            for (let i = 0; i < pixels.length; i += 4) {
                binaryData += (pixels[i] & 1).toString();
                
                if (binaryData.includes(delimiter)) {
                    binaryData = binaryData.substring(0, binaryData.indexOf(delimiter));
                    break;
                }
                
                if (binaryData.length > 1000000) {
                    throw new Error('No hidden data found');
                }
            }

            if (binaryData.length === 0 || !binaryData.includes(delimiter)) {
                throw new Error('No hidden data found in this image');
            }

            return binaryToString(binaryData);
        }

        function binaryToString(binary) {
            return binary.match(/.{8}/g).map(byte => 
                String.fromCharCode(parseInt(byte, 2))
            ).join('');
        }

        function handleScanResult(result, type) {
            lastScanResult = { data: result, type: type };
            
            const resultPanel = document.getElementById('resultPanel');
            const resultContent = document.getElementById('resultContent');
            const resultTitle = document.getElementById('resultTitle');
            const typeBadge = document.getElementById('typeBadge');
            
            resultPanel.classList.add('show');
            
            if (type === 'qr') {
                resultTitle.textContent = 'QR Code Found';
                typeBadge.textContent = 'QR Code';
                typeBadge.className = 'type-badge type-qr';
                
                let content = `<div class="text-result"><pre>${escapeHtml(result)}</pre></div>`;
                
                if (isValidUrl(result)) {
                    content += `
                        <div class="url-actions">
                            <button class="btn" onclick="window.open('${escapeHtml(result)}', '_blank')">
                                🌐 Open URL
                            </button>
                        </div>
                    `;
                }
                
                resultContent.innerHTML = content;
                
            } else if (type === 'steganography') {
                resultTitle.textContent = 'Hidden Data Found';
                typeBadge.textContent = 'Steganography';
                typeBadge.className = 'type-badge type-steganography';
                
                try {
                    const parsedData = JSON.parse(result);
                    displaySteganographyResult(parsedData);
                } catch (error) {
                    // Might be encrypted
                    resultContent.innerHTML = `
                        <div class="password-section">
                            <h4>🔐 Encrypted Data Detected</h4>
                            <p style="color: var(--text-secondary); margin-bottom: 16px;">Enter password to decrypt:</p>
                            <input type="password" id="passwordInput" class="password-input" placeholder="Enter password">
                            <button class="btn" onclick="decryptWithPassword()">🔓 Decrypt</button>
                        </div>
                    `;
                }
            }
            
            // Auto-hide after 8 seconds for continuous scanning
            setTimeout(() => {
                if (isScanning) {
                    resultPanel.classList.remove('show');
                }
            }, 8000);
        }

        function displaySteganographyResult(data) {
            const resultContent = document.getElementById('resultContent');
            let content = '';
            
            if (data.text) {
                content += `
                    <div class="text-result">
                        <h4>📝 Hidden Message</h4>
                        <pre>${escapeHtml(data.text)}</pre>
                    </div>
                `;
            }
            
            if (data.file) {
                content += `
                    <div class="file-result">
                        <h4>📁 Hidden File</h4>
                        <div class="file-info">
                            <p><strong>Name:</strong> ${escapeHtml(data.file.name)}</p>
                            <p><strong>Type:</strong> ${escapeHtml(data.file.type)}</p>
                        </div>
                        <button class="btn" onclick="downloadHiddenFile('${data.file.data}', '${escapeHtml(data.file.name)}', '${escapeHtml(data.file.type)}')">
                            💾 Download File
                        </button>
                    </div>
                `;
            }
            
            resultContent.innerHTML = content;
        }

        async function decryptWithPassword() {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                showNotification('Please enter a password', 'error');
                return;
            }

            try {
                const decryptedData = await decryptData(lastScanResult.data, password);
                const parsedData = JSON.parse(decryptedData);
                displaySteganographyResult(parsedData);
                showNotification('Data decrypted successfully!', 'success');
                
            } catch (error) {
                showNotification('Decryption failed. Check your password.', 'error');
            }
        }

        async function decryptData(encryptedData, password) {
            const encrypted_buffer = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
            const salt = encrypted_buffer.slice(0, 16);
            const iv = encrypted_buffer.slice(16, 28);
            const data = encrypted_buffer.slice(28);
            
            const encoder = new TextEncoder();
            const password_buffer = encoder.encode(password);
            
            const key = await crypto.subtle.importKey(
                'raw', password_buffer, 'PBKDF2', false, ['deriveBits', 'deriveKey']
            );
            
            const derived_key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                key, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
            );
            
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv }, derived_key, data
            );
            
            const decoder = new TextDecoder();
            return decoder.decode(decrypted);
        }

        function setScanMode(mode) {
            scanMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            
            let modeText = '';
            switch(mode) {
                case 'both': modeText = 'Scanning for QR codes and hidden data'; break;
                case 'qr': modeText = 'QR code scanning only'; break;
                case 'steganography': modeText = 'Hidden data scanning only'; break;
            }
            showNotification(modeText, 'success');
        }

        async function toggleTorch() {
            if (qrScanner) {
                try {
                    const torchBtn = document.getElementById('torchToggle');
                    await qrScanner.toggleFlash();
                    torchBtn.classList.toggle('active');
                } catch (error) {
                    showNotification('Flashlight not supported', 'error');
                }
            }
        }

        async function flipCamera() {
            if (qrScanner) {
                currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
                await qrScanner.setCamera(currentCamera);
                showNotification(`Switched to ${currentCamera} camera`, 'success');
            }
        }

        function copyToClipboard() {
            if (lastScanResult) {
                navigator.clipboard.writeText(lastScanResult.data).then(() => {
                    showNotification('Copied to clipboard!', 'success');
                }).catch(() => {
                    showNotification('Failed to copy', 'error');
                });
            }
        }

        function downloadHiddenFile(base64Data, fileName, fileType) {
            try {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = `data:${fileType};base64,${base64Data}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification(`Downloaded ${fileName}`, 'success');
            } catch (error) {
                showNotification('Download failed', 'error');
            }
        }

        function showStatus(show) {
            const statusBar = document.getElementById('statusBar');
            if (show) {
                statusBar.classList.add('show');
            } else {
                statusBar.classList.remove('show');
            }
        }

        function showNotification(message, type) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => notification.classList.add('show'), 100);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
